{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="auth">
  <h1>登录 CampusEvent</h1>
  <form method="post">
    <input type="hidden" name="next" value="{{ next or '' }}">
    <label>学号 / 工号
      <input name="student_id" value="{{ student_id }}" autocomplete="username" required>
    </label>
    <label>密码
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn" type="submit">登录</button>
  </form>
  <p class="hint">演示账号：admin / admin123　student1 / 123456　student2 / 123456</p>
</div>
{% endblock %}
