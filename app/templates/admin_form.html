{% extends "base.html" %}
{% block title %}{{ "编辑活动" if activity else "新建活动" }}{% endblock %}
{% block content %}
<h1>{{ "编辑活动" if activity else "新建活动" }}</h1>

<form class="form" method="post">
  <label>活动名称
    <input name="title" required
           value="{{ form.get('title') if form.get('title') is not none else (activity.title if activity else '') }}">
  </label>
  <label>分类
    <input name="category" value="{{ form.get('category') if form.get('category') is not none else (activity.category if activity else '') }}">
  </label>
  <label>开始时间
    <input name="start_at" type="datetime-local" required
           value="{{ form.get('start_at') if form.get('start_at') is not none else (activity.start_at.strftime('%Y-%m-%dT%H:%M') if activity else '') }}">
  </label>
  <label>地点
    <input name="location" value="{{ form.get('location') if form.get('location') is not none else (activity.location if activity else '') }}">
  </label>
  <label>人数上限
    <input name="capacity" type="number" min="1" required
           value="{{ form.get('capacity') if form.get('capacity') is not none else (activity.capacity if activity else 30) }}">
  </label>
  <label>报名方式
    <select name="policy_type">
      <option value="DIRECT" {% if (form.get('policy_type') or (activity.policy_type.value if activity else 'DIRECT')) == 'DIRECT' %}selected{% endif %}>直接报名（立即通过）</option>
      <option value="REVIEW" {% if (form.get('policy_type') or (activity.policy_type.value if activity else '')) == 'REVIEW' %}selected{% endif %}>管理员审核（先待审核）</option>
      <option value="LOTTERY" {% if (form.get('policy_type') or (activity.policy_type.value if activity else '')) == 'LOTTERY' %}selected{% endif %}>抽签录取（报名后统一抽签）</option>
    </select>
  </label>
  <div class="inline-actions">
    <button class="btn" type="submit">保存</button>
    <a class="btn ghost" href="{{ url_for('admin.index') }}">返回</a>
  </div>
</form>
{% endblock %}
